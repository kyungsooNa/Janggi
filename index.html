<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승강급 장기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Zhi+Mang+Xing&text=%E6%BC%A2%E8%BB%8A%E9%A6%AC%E8%B1%A1%E5%8C%85%E5%A3%AB%E5%85%B5%E6%A5%9A%E8%BD%A6%E9%A9%AC%E5%8D%92&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="btn-settings" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <h1 class="title" id="title">승강급 대국</h1>
    <button class="icon-btn" id="btn-log" type="button" aria-label="기보 보기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c4.97 0 9 3.13 9 7s-4.03 7-9 7c-1.06 0-2.08-.14-3.02-.4L4 20l1.4-3.6C3.9 15.1 3 13.13 3 11c0-3.87 4.03-7 9-7Z" /><circle class="dot" cx="8" cy="11" r="1.1" /><circle class="dot" cx="12" cy="11" r="1.1" /><circle class="dot" cx="16" cy="11" r="1.1" /></svg>
    </button>
  </header>

  <main class="board-wrap">
    <svg id="board" class="board" viewBox="0 0 904 1004" role="img" aria-label="장기판"></svg>
    <div class="toast" id="toast" aria-live="assertive"></div>
  </main>

  <div class="turnbar"><span id="turnbar-fill"></span></div>

  <section class="players">
    <div class="player me" id="player-me">
      <div class="clock-row"><span class="time" id="me-time">05:00</span><span class="byo" id="me-byo">3</span></div>
      <div class="id-row">
        <div class="avatar"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="18" r="9" /><path d="M7 46c1.5-10 8.5-15 17-15s15.5 5 17 15Z" /></svg></div>
        <span class="side-mark cho" id="me-side">楚</span>
      </div>
      <div class="info-row"><span class="score" id="me-score">72.0점</span> <span class="rank" id="me-rank">10급</span> <span class="name" id="me-name">나</span></div>
    </div>

    <div class="stopwatch" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <circle class="sw-face" cx="32" cy="32" r="29" />
        <g class="sw-ticks" id="sw-ticks"></g>
        <line class="sw-hand" id="sw-hand" x1="32" y1="32" x2="32" y2="10" />
        <circle class="sw-pin" cx="32" cy="32" r="2.4" />
      </svg>
    </div>

    <div class="player opp" id="player-opp">
      <div class="clock-row"><span class="byo" id="opp-byo">3</span><span class="time" id="opp-time">05:00</span></div>
      <div class="id-row">
        <span class="side-mark han" id="opp-side">漢</span>
        <div class="avatar ai"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="11" y="13" width="26" height="22" rx="6" /><circle class="eye" cx="19" cy="24" r="3" /><circle class="eye" cx="29" cy="24" r="3" /><path d="M24 13V7M20 7h8" /></svg></div>
      </div>
      <div class="info-row"><span class="rank" id="opp-rank">10급</span> <span class="name" id="opp-name">AI</span> <span class="score" id="opp-score">73.5점</span></div>
    </div>
  </section>

  <nav class="actions">
    <button type="button" class="pill" id="btn-pass">한수 쉼</button>
    <button type="button" class="pill" id="btn-resign">기 권</button>
    <button type="button" class="pill" id="btn-items">아이템</button>
  </nav>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>
</div>
<!--/APP-->
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ranks.js"></script>
<script src="js/main.js"></script>
</body>
</html>
